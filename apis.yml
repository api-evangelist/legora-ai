aid: legora-ai
name: Legora
description: >-
  Legora is a Stockholm, Sweden-based collaborative AI workspace for lawyers,
  founded in 2023 as Leya by Max Junestrand (CEO), Sigge Labor (CTO), and
  August Erséus, and rebranded to Legora in 2025. The platform delivers an
  agentic operating system, Legora aOS, that helps law firms and in-house
  legal teams execute document review, legal research, drafting, advisory
  work, and regulatory monitoring at scale. Core product surfaces include
  Agent (end-to-end execution of complex legal work), Monitors (regulatory
  change tracking), Lists (workflow organization), Tabular Review, Workflows,
  Legal Research, Portal, Editor, a Word Add-in, an Outlook Add-in, and a
  mobile app, with practice-area solutions spanning M&A, litigation, banking,
  tax, and insurance. Legora is built on Azure OpenAI Service, holds ISO
  42001, ISO 27001, and SOC 2 Type II certifications, operates under GDPR
  with EU and US data residency options, supports BYOK encryption, and
  commits not to train AI models on customer data. The company closed a
  $550M Series D led by Accel in March 2026 at a $5.55B valuation. Legora's
  commercial model is enterprise SaaS sold to law firms and in-house teams;
  there is no public developer API, SDK, OpenAPI specification, GitHub
  organization, or open-source release for the Legora platform.
